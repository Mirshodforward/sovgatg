<!doctype html>
<!-- OG rasm shabloni (1200×630). Rasmni yasash: node brand/og.mjs → assets/og.jpg -->
<html lang="uz">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700&family=Outfit:wght@700;800&display=swap">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#05061A}
  body{position:relative;font-family:Manrope,sans-serif;color:#F3F4FF;-webkit-font-smoothing:antialiased}
  .g{position:absolute;border-radius:50%;filter:blur(90px)}
  .g1{width:720px;height:720px;left:-280px;top:-380px;background:radial-gradient(circle,#0E9CFF,transparent 66%);opacity:.6}
  .g2{width:680px;height:680px;right:-180px;top:-160px;background:radial-gradient(circle,#B21BE6,transparent 66%);opacity:.5}
  .g3{width:640px;height:640px;left:280px;bottom:-460px;background:radial-gradient(circle,#5B2BFF,transparent 66%);opacity:.6}
  .stars{position:absolute;inset:0;opacity:.55;background-size:420px 420px;background-image:
    radial-gradient(1.5px 1.5px at 12% 18%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 72% 12%,#cfeaff 50%,transparent 51%),
    radial-gradient(1.5px 1.5px at 38% 62%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 86% 48%,#e6d6ff 50%,transparent 51%),
    radial-gradient(1px 1px at 22% 84%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 58% 30%,#d4f8ff 50%,transparent 51%)}
  .gt{background:linear-gradient(100deg,#6FF3FF 0%,#86A0FF 36%,#BC8BFF 66%,#FF7AE8 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
  .tx{position:absolute;left:76px;top:70px;width:640px}
  .brand{font:800 32px/1 Outfit,sans-serif;letter-spacing:-.02em}
  h1{margin:70px 0 0;font:800 68px/1.02 Outfit,sans-serif;letter-spacing:-.035em}
  p{margin:24px 0 0;font:600 25px/1.4 Manrope,sans-serif;color:#A9AFD4}
  .chips{display:flex;gap:12px;margin-top:34px}
  .chip{padding:10px 18px;border-radius:100px;border:1px solid rgba(165,175,255,.3);background:rgba(140,150,255,.09);font:700 19px/1 Manrope,sans-serif;color:#DADDF7}
  .dom{position:absolute;left:76px;bottom:58px;font:800 27px/1 Outfit,sans-serif;color:#4FEFFF;letter-spacing:-.01em}
  .orb{position:absolute;left:770px;top:70px;width:440px;height:440px;border-radius:50%;background:radial-gradient(circle at 42% 40%,rgba(34,233,255,.42),rgba(155,77,255,.36) 45%,rgba(244,59,223,.16) 64%,transparent 72%);filter:blur(36px)}
  .pool{position:absolute;left:820px;top:528px;width:340px;height:60px;border-radius:50%;background:radial-gradient(closest-side,rgba(160,90,255,.6),rgba(79,116,255,.22) 55%,transparent);filter:blur(6px)}
  .art{position:absolute;left:840px;top:44px;height:480px;filter:drop-shadow(0 26px 50px rgba(110,50,255,.55))}
</style>
</head>
<body>
  <i class="g g1"></i><i class="g g2"></i><i class="g g3"></i><i class="stars"></i>
  <div class="tx">
    <div class="brand">Sovga<span class="gt">TG</span></div>
    <h1>Telegram sovg'alari<br><span class="gt">bir joyda</span></h1>
    <p>Gift · NFT sovg'a · ijara · rejalashtirilgan yetkazish</p>
    <div class="chips"><span class="chip">So'mda to'lov</span><span class="chip">Uzcard · Humo</span><span class="chip">24/7 avtomatik</span></div>
  </div>
  <div class="dom">sovgatg.uz</div>
  <i class="orb"></i><i class="pool"></i>
  <img class="art" src="logo-mark.png" alt="">
</body>
</html>
